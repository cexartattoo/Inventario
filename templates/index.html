<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de Inventario - {{ warehouse_name }}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-warehouse me-2"></i>
                <strong>{{ warehouse_name }}</strong>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Pestañas de Navegación (Corregidas) -->
                <ul class="navbar-nav nav nav-pills" id="main-nav-pills" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="asistente-nav-tab" data-bs-toggle="tab" data-bs-target="#asistente-tab" type="button" role="tab" aria-controls="asistente-tab" aria-selected="true">
                            <i class="fas fa-microphone-alt me-1"></i> Asistente
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="inventario-nav-tab" data-bs-toggle="tab" data-bs-target="#inventario-tab" type="button" role="tab" aria-controls="inventario-tab" aria-selected="false">
                            <i class="fas fa-boxes-stacked me-1"></i> Inventario
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="facturacion-nav-tab" data-bs-toggle="tab" data-bs-target="#facturacion-tab" type="button" role="tab" aria-controls="facturacion-tab" aria-selected="false">
                            <i class="fas fa-file-invoice-dollar me-1"></i> Facturación
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- Contenido de las Pestañas (Corregido) -->
        <div class="tab-content" id="myTabContent">
            <!-- Pestaña del Asistente -->
            <div class="tab-pane fade show active" id="asistente-tab" role="tabpanel" aria-labelledby="asistente-nav-tab">
                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title text-center mb-3">Consola del Asistente de Voz</h5>
                                <div id="conversation-log" class="conversation-log mb-3 p-3 border rounded bg-light" style="height: 40vh; overflow-y: auto;">
                                    <div class="message assistant">
                                        <p>¡Hola! Soy Jarvis. ¿En qué puedo ayudarte hoy?</p>
                                    </div>
                                </div>
                                <div class="text-center">
                                    <button id="voice-button" class="btn btn-primary btn-lg rounded-circle" style="width: 80px; height: 80px;">
                                        <i class="fas fa-microphone-alt fa-2x"></i>
                                    </button>
                                    <p id="status-text" class="mt-2 text-muted">Presiona para hablar</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pestaña de Inventario -->
            <div class="tab-pane fade" id="inventario-tab" role="tabpanel" aria-labelledby="inventario-nav-tab">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Gestión de Inventario</h5>
                            <div class="input-group w-50">
                                <span class="input-group-text"><i class="fas fa-search"></i></span>
                                <input type="text" id="search-inventory" class="form-control" placeholder="Buscar por nombre o descripción...">
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Ref.</th>
                                        <th>Nombre</th>
                                        <th>Descripción</th>
                                        <th>Precio Venta</th>
                                        <th>Cantidad</th>
                                        <th>Ubicación</th>
                                    </tr>
                                </thead>
                                <tbody id="inventory-table-body">
                                    <!-- Los productos se cargarán aquí dinámicamente -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pestaña de Facturación -->
            <div class="tab-pane fade" id="facturacion-tab" role="tabpanel" aria-labelledby="facturacion-nav-tab">
                <div class="card shadow-sm">
                     <div class="card-header">
                        <h5 class="mb-0">Última Factura Generada</h5>
                    </div>
                    <div class="card-body" id="invoice-display">
                        <p class="text-muted">Aquí se mostrará la última factura generada por el asistente.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JS Personalizado -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
